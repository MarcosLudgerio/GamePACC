{% extends 'base.html' %}

<title>{% block title %}GamePacc{% endblock %}</title>

{% block content %}

    <!-- Área de exemplo: cartão com chamada -->
    <section class="rounded-lg border border-gray-100 bg-white p-8 shadow-sm">
        <h2 class="text-xl font-semibold text-gp-blue-deep">Bem-vindo ao Gamepacc</h2>
        <p class="mt-3 text-gray-600">Use este template como base — substitua a logo em <code
                class="bg-gray-100 px-1 rounded">/assets/logo-gamepacc.png</code> e comece a construir suas telas.
        </p>


        <!-- Exemplos rápidos de botões com as cores da marca -->
        <div class="mt-6 flex flex-wrap gap-3">
            <button class="px-4 py-2 rounded-md font-semibold text-white"
                    style="background-color:var(--gp-red-coral)">Ação primária
            </button>
            <button class="px-4 py-2 rounded-md font-semibold text-white"
                    style="background-color:var(--gp-turquoise)">Secundária
            </button>
            <button class="px-4 py-2 rounded-md font-semibold text-gray-800 bg-gray-100">Neutra</button>
        </div>

    </section>

{% endblock %}
